[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prometheus"
version = "0.1.0"
description = "Mission Autopsy: reconstruct why a spacecraft mission failed."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Prometheus" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "ruptures>=1.1",
    "networkx>=3.2",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "typer>=0.12",
    "python-dotenv>=1.0",
    "groq>=0.9",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
prometheus = "prometheus.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
prometheus = ["sim/scenarios/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Typer declares options via function-call defaults by design.
"src/prometheus/cli.py" = ["B008"]
